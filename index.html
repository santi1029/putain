<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #05020c;
            overflow-x: hidden;
        }

        /* Sfondo a griglia minimale */
        .bg-grid {
            background-size: 40px 40px;
            background-image: linear-gradient(to right, rgba(147, 51, 234, 0.05) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(147, 51, 234, 0.05) 1px, transparent 1px);
        }

        /* Effetti di luce fluttuanti */
        .glow-orb {
            filter: blur(140px);
            opacity: 0.4;
            animation: floatGlow 12s ease-in-out infinite alternate;
        }

        @keyframes floatGlow {
            0% { transform: translate(0px, 0px) scale(1); }
            100% { transform: translate(-30px, 50px) scale(1.2); }
        }

        /* Card della Galleria con effetto Glassmorphism */
        .gallery-card {
            position: relative;
            background: rgba(13, 8, 24, 0.6);
            border: 1px solid rgba(147, 51, 234, 0.15);
            border-radius: 1rem;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .gallery-card:hover {
            border-color: rgba(168, 85, 247, 0.5);
            transform: translateY(-5px);
            box-shadow: 0 10px 30px -10px rgba(147, 51, 234, 0.4);
        }

        /* Overlay sfumato che compare al passaggio del mouse */
        .card-overlay {
            background: linear-gradient(to top, #05020c 0%, transparent 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .gallery-card:hover .card-overlay {
            opacity: 1;
        }

        /* Zoom dell'immagine all'hover */
        .gallery-img {
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .gallery-card:hover .gallery-img {
            transform: scale(1.08);
        }

        /* Testo brillante */
        .shiny-text {
            background: linear-gradient(to right, #d8b4fe, #ffffff, #a855f7);
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: shine 4s linear infinite;
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        /* Scrollbar stilizzata */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #05020c; }
        ::-webkit-scrollbar-thumb { background: #6b21a8; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #9333ea; }
    </style>
</head>
<body class="text-gray-200 min-h-screen relative bg-grid antialiased">

    <div class="glow-orb absolute top-0 left-[-10%] w-[600px] h-[600px] bg-purple-700 rounded-full pointer-events-none z-0"></div>
    <div class="glow-orb absolute bottom-0 right-[-10%] w-[500px] h-[500px] bg-fuchsia-900 rounded-full pointer-events-none z-0" style="animation-delay: -5s;"></div>

    <div class="max-w-7xl mx-auto px-4 py-12 relative z-10">
        
        <header class="flex flex-col md:flex-row justify-between items-center mb-16 gap-6 border-b border-purple-500/20 pb-6">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-purple-600 to-indigo-900 flex items-center justify-center shadow-[0_0_25px_rgba(147,51,234,0.4)] border border-purple-500/30">
                    <i class="fa-solid fa-layer-group text-white text-xl"></i>
                </div>
                <div>
                    <h1 class="text-3xl font-black tracking-wider shiny-text uppercase">Archive</h1>
                    <p class="text-xs text-purple-400 font-mono tracking-widest uppercase">Creative Repository</p>
                </div>
            </div>
            
            <div class="flex gap-4">
                <button class="px-5 py-2 rounded-lg bg-purple-900/30 border border-purple-500/30 text-sm font-medium hover:bg-purple-800/40 transition-colors backdrop-blur-sm">
                    <i class="fa-solid fa-filter mr-2 text-purple-400"></i> Filtra
                </button>
            </div>
        </header>

        <div id="gallery-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 auto-rows-[250px]">
            </div>

    </div>

    <div id="lightbox" class="fixed inset-0 z-50 bg-black/90 backdrop-blur-md hidden opacity-0 transition-opacity duration-300 flex items-center justify-center p-4">
        <button onclick="closeLightbox()" class="absolute top-6 right-6 w-12 h-12 rounded-full bg-white/10 hover:bg-purple-600/50 border border-white/20 text-white flex items-center justify-center transition-all">
            <i class="fa-solid fa-xmark text-xl"></i>
        </button>
        
        <div class="max-w-5xl w-full flex flex-col items-center">
            <img id="lightbox-img" src="" alt="Zoom" class="max-h-[80vh] object-contain rounded-lg shadow-[0_0_50px_rgba(147,51,234,0.3)] border border-purple-500/20">
            <div class="mt-6 text-center">
                <h3 id="lightbox-title" class="text-2xl font-bold text-white mb-1"></h3>
                <p id="lightbox-category" class="text-purple-400 font-mono text-sm tracking-wider uppercase"></p>
            </div>
        </div>
    </div>

    <script>
        // QUI INSERISCI LE TUE IMMAGINI!
        // Puoi usare link esterni (Imgur, Discord, ecc) o mettere i file fisici nella stessa cartella 
        // e scrivere il nome del file (es. "render1.png") al posto del link di Unsplash.
        const artworks = [
            {
                id: 1,
                title: "Assetto Corsa - Server Setup",
                category: "Sim-Racing // Config",
                url: "20250915-202018-bst_csr-bg_ferrari_enzo-AC Aura Photo.jpg",
                span: "col-span-1 sm:col-span-2 row-span-2" // Rende l'immagine più grande nella griglia
            },
            {
                id: 2,
                title: "D20 RPG - Sprite Design",
                category: "Java Dev // Assets",
                url: "https://images.unsplash.com/photo-1550745165-9bc0b252726f?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80",
                span: "col-span-1 row-span-1"
            },
            {
                id: 3,
                title: "FL Studio - Nuova Base",
                category: "Beatmaking // Workspace",
                url: "https://images.unsplash.com/photo-1598488035139-bdbb2231ce04?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80",
                span: "col-span-1 row-span-1"
            },
            {
                id: 4,
                title: "BeamNG - Test Export",
                category: "Simulation // Render",
                url: "https://images.unsplash.com/photo-1619717651717-3860bb4a9193?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80",
                span: "col-span-1 sm:col-span-2 row-span-1"
            },
            {
                id: 5,
                title: "Hardware Setup",
                category: "DIY // Modding",
                url: "https://images.unsplash.com/photo-1587202372634-32705e3bf49c?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80",
                span: "col-span-1 row-span-1"
            }
        ];

        const galleryGrid = document.getElementById('gallery-grid');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const lightboxTitle = document.getElementById('lightbox-title');
        const lightboxCategory = document.getElementById('lightbox-category');

        // Genera la griglia
        artworks.forEach(art => {
            const card = document.createElement('div');
            // Applica le classi per definire la grandezza nella griglia, se specificata
            card.className = `gallery-card group ${art.span || 'col-span-1 row-span-1'}`;
            
            card.innerHTML = `
                <img src="${art.url}" alt="${art.title}" class="gallery-img w-full h-full object-cover absolute inset-0">
                <div class="card-overlay absolute inset-0 flex flex-col justify-end p-6">
                    <span class="text-xs font-mono text-purple-400 mb-1 tracking-widest uppercase">${art.category}</span>
                    <h3 class="text-xl font-bold text-white">${art.title}</h3>
                </div>
            `;

            // Apre il Lightbox al click
            card.addEventListener('click', () => {
                lightboxImg.src = art.url;
                lightboxTitle.innerText = art.title;
                lightboxCategory.innerText = art.category;
                
                lightbox.classList.remove('hidden');
                // Piccolo delay per permettere la transizione di opacità
                setTimeout(() => lightbox.classList.remove('opacity-0'), 10);
                document.body.style.overflow = 'hidden'; // Blocca lo scroll della pagina
            });

            galleryGrid.appendChild(card);
        });

        // Chiude il Lightbox
        window.closeLightbox = function() {
            lightbox.classList.add('opacity-0');
            setTimeout(() => {
                lightbox.classList.add('hidden');
                document.body.style.overflow = 'auto'; // Riattiva lo scroll
            }, 300);
        };

        // Chiudi il lightbox premendo ESC
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && !lightbox.classList.contains('hidden')) {
                closeLightbox();
            }
        });
    </script>
</body>
</html>
